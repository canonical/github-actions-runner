name: Runner CI

on:
  workflow_dispatch:
  push:
    branches:
    - main
    - releases/*
    paths-ignore:
    - '**.md'
  pull_request:
    branches:
    - '**'
    paths-ignore:
    - '**.md'

concurrency:
  group: runner-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(vars.ENABLE_RISCV64_BUILDS == 'true' && '["linux-s390x","linux-ppc64le","linux-x64","linux-arm64","linux-arm","linux-riscv64"]' || '["linux-s390x","linux-ppc64le","linux-x64","linux-arm64","linux-arm"]') }}
        include:

        - runtime: linux-x64
          runs_on: amd64

        - runtime: linux-arm64
          runs_on: arm64

        - runtime: linux-arm
          runs_on: arm64
          patch_tag: arm

        - runtime: linux-ppc64le
          runs_on: ppc64le
          patch_tag: ppc64le

        - runtime: linux-s390x
          runs_on: s390x
          patch_tag: s390x

    runs-on: [ self-hosted, noble, generic, "${{ matrix.runs_on || 'riscv64' }}" ]
    steps:
    - uses: actions/checkout@v7

    - name: Install DotNet SDK
      if: matrix.runtime != 'linux-riscv64'
      run: sudo apt-get update && sudo apt-get install -y dotnet-sdk-8.0

    - name: Install community RISC-V DotNet SDK
      if: matrix.runtime == 'linux-riscv64'
      run: bash .github/scripts/setup-riscv64-dotnet.sh

    - name: Apply patches
      if: matrix.runtime == 'linux-s390x' || matrix.runtime == 'linux-ppc64le' || matrix.runtime == 'linux-arm' || matrix.runtime == 'linux-riscv64'
      run: |
        if [[ "${{ matrix.runtime }}" == "linux-riscv64" && ( "$GITHUB_REF" == refs/heads/releases/* || "$GITHUB_BASE_REF" == releases/* ) ]]; then
          git apply patches/runner-sdk8-riscv64.patch
        else
          git apply patches/runner-main-sdk8-${{ matrix.patch_tag || 'riscv64' }}.patch
        fi

    - name: Update DotNet required version pin
      if: matrix.runtime != 'linux-riscv64'
      run: |
        current_version=$( cat src/global.json | jq -r '.sdk.version' )
        if [ "${{ matrix.runtime }}" = "linux-arm" ]; then
          # linux-arm is patched to build against .NET 9 (Y2038/time64 SSL
          # fix), so relax the pin to major.minor dynamically to match
          # whatever SDK line the patch bumped global.json to (e.g.
          # 9.0.318 -> 9.0), instead of the hardcoded 8.0 used below.
          sed -i "s/${current_version}/${current_version%.*}/" src/global.json
        else
          sed -i "s/${current_version}/8.0/" src/global.json
        fi

    # Build runner layout
    - name: Build & Layout Release
      run: |
        ./dev.sh layout Release ${{ matrix.runtime }}
      working-directory: src

    # Fork-only: see .github/scripts/strip-bundled-npm.sh.
    - name: Strip bundled npm and corepack
      run: |
        if [[ "${{ matrix.runtime }}" == "linux-riscv64" ]] && compgen -G '_layout/externals/node20*' > /dev/null; then
          echo "::error::RISC-V runner must not bundle Node 20."
          exit 1
        fi
        .github/scripts/strip-bundled-npm.sh _layout ${{ matrix.runtime }}

    # Run tests
    - name: L0
      run: |
        # The self-hosted runner's job hooks leak into JobExtension L0 tests and add a step
        unset ACTIONS_RUNNER_HOOK_JOB_STARTED ACTIONS_RUNNER_HOOK_JOB_COMPLETED
        # 2026/11/25 - ProcessExtensionL0.SuccessReadProcessEnv may be flaky; retrigger this job once before investigating a failure.
        ./dev.sh test
      working-directory: src
      if: matrix.runtime == 'linux-x64' || matrix.runtime == 'linux-riscv64'


    # L0 uses DEBUG-only test hooks; keep Release layout/package validation separate.
    - name: L0 (native arm64)
      if: matrix.runtime == 'linux-arm64'
      run: |
        unset ACTIONS_RUNNER_HOOK_JOB_STARTED ACTIONS_RUNNER_HOOK_JOB_COMPLETED
        # 2026/11/25 - exclude ProcessExtensionL0.SuccessReadProcessEnv on arm64 because its one-shot /proc environment read races Node execve; remove after the upstream retry fix lands.
        dotnet test Test/Test.csproj -c Debug /p:PackageRuntime=${{ matrix.runtime }} --logger:trx --filter "FullyQualifiedName!~GitHub.Runner.Common.Tests.ProcessExtensionL0"
      working-directory: src

    - name: L0 (native ppc64le/s390x)
      if: matrix.runtime == 'linux-ppc64le' || matrix.runtime == 'linux-s390x'
      run: |
        unset ACTIONS_RUNNER_HOOK_JOB_STARTED ACTIONS_RUNNER_HOOK_JOB_COMPLETED
        ./dev.sh test Debug ${{ matrix.runtime }}
      working-directory: src

    # Create runner package tar.gz/zip
    - name: Package Release
      if: github.event_name != 'pull_request'
      run: |
        ./dev.sh package Release ${{ matrix.runtime }}
      working-directory: src

    - name: Test package
      if: github.event_name != 'pull_request' && matrix.runtime != 'linux-arm'
      run: |
        mkdir package_test
        tar -xvzf ../_package/*.tar.gz -C package_test
        ./package_test/config.sh --version
        # Validate the packaged payload, not only _layout: packaging can omit or mis-version bundled Node runtimes.
        NODE24_VERSION=$(sed -n 's/^NODE24_VERSION="\([0-9.]*\)"/\1/p' Misc/externals.sh)
        test -x package_test/externals/node24/bin/node
        test ! -e package_test/externals/node20
        test ! -e package_test/externals/node22
        test "$(package_test/externals/node24/bin/node --version)" = "v$NODE24_VERSION"
      working-directory: src

    # linux-arm produces armv7l (32-bit) binaries that cannot execute on the
    # arm64 build host directly, so smoke-test the package inside a 32-bit arm container.
    # On arm64 hosts with native AArch32 support this runs natively; if binfmt/qemu-user
    # emulation is configured on the runner, it may run under emulation instead.
    - name: Test package (arm32v7 container)
      if: github.event_name != 'pull_request' && matrix.runtime == 'linux-arm'
      run: |
        mkdir package_test
        tar -xzf ../_package/*.tar.gz -C package_test
        # Validate the packaged payload, not only _layout: packaging can omit or mis-version bundled Node runtimes.
        NODE22_VERSION=$(sed -n 's/^NODE22_VERSION="\([0-9.]*\)"/\1/p' Misc/externals.sh)
        test -x package_test/externals/node22/bin/node
        test ! -e package_test/externals/node20
        test ! -e package_test/externals/node24
        # Use sudo only if the runner user can't reach the Docker daemon directly.
        DOCKER=docker
        if ! docker info >/dev/null 2>&1; then DOCKER="sudo docker"; fi
        $DOCKER run --rm --platform linux/arm/v7 \
          -e RUNNER_ALLOW_RUNASROOT=1 \
          -e EXPECTED_NODE_VERSION="$NODE22_VERSION" \
          -v "$(pwd)/package_test:/runner" -w /runner \
          arm32v7/ubuntu:noble \
          bash -c 'set -e; apt-get update -qq; DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libicu74 libatomic1 ca-certificates >/dev/null; ./config.sh --version; test "$(./externals/node22/bin/node --version)" = "v$EXPECTED_NODE_VERSION"; test "$(./externals/node22/bin/node -p process.arch)" = arm'
      working-directory: src

    # Upload runner package tar.gz/zip as artifact
    - name: Publish Artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: runner-package-${{ matrix.runtime }}
        path: |
          _package

    - uses: mattermost/action-mattermost-notify@master
      if: ${{ failure() }}
      with:
        MATTERMOST_WEBHOOK_URL: ${{ secrets.MM_WEBHOOK_URL }}
        TEXT: |
          ${{ github.repository }} build failed.
          [Pipeline](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) was failed :red_circle:
          ${{ secrets.MM_PING_USERS }}
        MATTERMOST_USERNAME: ${{ github.triggering_actor }}
        MATTERMOST_ICON_URL: https://cdn-icons-png.flaticon.com/512/25/25231.png
