name: Update Runner Patches (Commit-to-Commit)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'patches/runner-main-sdk8-*.patch'
      - 'patches/last_processed_commit.txt'

permissions:
  contents: write # Required to push patch updates and branches
  pull-requests: write # Required to create pull requests via peter-evans/create-pull-request

jobs:
  update-patches:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout your repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Clone upstream runner repository
      run: |
        git clone https://github.com/actions/runner.git upstream-runner
        cd upstream-runner
        git checkout main

    - name: Get commits
      id: get-commits
      run: |
        cd upstream-runner
        # Get latest commit
        LATEST_COMMIT=$(git rev-parse HEAD)
        echo "LATEST_COMMIT=$LATEST_COMMIT" >> $GITHUB_OUTPUT
        echo "LATEST_COMMIT_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        
        # Get previous processed commit
        if [ -f ../patches/last_processed_commit.txt ]; then
          PREVIOUS_COMMIT=$(cat ../patches/last_processed_commit.txt)
          PREVIOUS_COMMIT_SHORT="${PREVIOUS_COMMIT:0:7}"
          echo "PREVIOUS_COMMIT=$PREVIOUS_COMMIT" >> $GITHUB_OUTPUT
          echo "PREVIOUS_COMMIT_SHORT=$PREVIOUS_COMMIT_SHORT" >> $GITHUB_OUTPUT
        else
          echo "PREVIOUS_COMMIT=" >> $GITHUB_OUTPUT
          echo "PREVIOUS_COMMIT_SHORT=" >> $GITHUB_OUTPUT
        fi

    - name: Check for new commits
      if: steps.get-commits.outputs.PREVIOUS_COMMIT == steps.get-commits.outputs.LATEST_COMMIT
      run: |
        echo "No new commits - skipping"
        exit 0

    - name: Verify previous commit exists
      if: steps.get-commits.outputs.PREVIOUS_COMMIT != '' && steps.get-commits.outputs.PREVIOUS_COMMIT != steps.get-commits.outputs.LATEST_COMMIT
      run: |
        cd upstream-runner
        if ! git rev-parse ${{ steps.get-commits.outputs.PREVIOUS_COMMIT }} >/dev/null 2>&1; then
          echo "Previous commit ${{ steps.get-commits.outputs.PREVIOUS_COMMIT }} not found"
          exit 1
        fi

    - name: Process architectures
      if: steps.get-commits.outputs.PREVIOUS_COMMIT != '' && steps.get-commits.outputs.PREVIOUS_COMMIT != steps.get-commits.outputs.LATEST_COMMIT
      id: process-arches
      run: |
        RESULT_DIR="${RUNNER_TEMP}/patch-update-results"
        mkdir -p "$RESULT_DIR" patches
        SUCCESSFUL_ARCHES="$RESULT_DIR/successful_arches.txt"
        FAILED_ARCHES="$RESULT_DIR/failed_arches.txt"
        : > "$SUCCESSFUL_ARCHES"
        : > "$FAILED_ARCHES"

        for arch in ppc64le s390x arm; do
          echo "Processing $arch..."
          PATCH_FILE="../patches/runner-main-sdk8-$arch.patch"
          cd upstream-runner

          # Reset to a clean upstream checkout before each architecture.
          git reset --hard
          git clean -fd

          # The patch trailer is the authoritative rebase base. This allows a
          # manually regenerated patch to survive an upstream commit arriving
          # before the next scheduled run.
          PATCH_BASE=""
          if [ -f "$PATCH_FILE" ]; then
            PATCH_BASE=$(sed 's/\r$//' "$PATCH_FILE" | \
              grep -E '^# From upstream commit: [0-9a-f]{40}$' | tail -n 1 | \
              sed 's/^# From upstream commit: //')
          fi

          if [ -z "$PATCH_BASE" ]; then
            echo "::error::No valid upstream commit trailer for $arch"
            cd ..
            echo "$arch" >> "$FAILED_ARCHES"
            continue
          fi

          if ! git rev-parse "$PATCH_BASE^{commit}" >/dev/null 2>&1 || \
             ! git merge-base --is-ancestor "$PATCH_BASE" "${{ steps.get-commits.outputs.LATEST_COMMIT }}"; then
            echo "::error::Patch base $PATCH_BASE for $arch is not an ancestor of ${{ steps.get-commits.outputs.LATEST_COMMIT_SHORT }}"
            cd ..
            echo "$arch" >> "$FAILED_ARCHES"
            continue
          fi

          if [ "$PATCH_BASE" = "${{ steps.get-commits.outputs.LATEST_COMMIT }}" ]; then
            git checkout "${{ steps.get-commits.outputs.LATEST_COMMIT }}"
            if ! git apply --check --whitespace=nowarn "$PATCH_FILE"; then
              echo "::error::Patch for $arch is marked for ${{ steps.get-commits.outputs.LATEST_COMMIT_SHORT }} but does not apply cleanly"
              cd ..
              echo "$arch" >> "$FAILED_ARCHES"
              continue
            fi
            echo "Patch for $arch already targets ${{ steps.get-commits.outputs.LATEST_COMMIT_SHORT }} - skipping rebase"
            cd ..
            echo "$arch" >> "$SUCCESSFUL_ARCHES"
            continue
          fi

          # Apply the patch to the exact upstream commit named by its trailer.
          git checkout "$PATCH_BASE"
          if ! git apply --check --whitespace=nowarn "$PATCH_FILE" || \
             ! git apply --whitespace=nowarn "$PATCH_FILE"; then
            echo "::error::Patch application failed for $arch on base $PATCH_BASE"
            cd ..
            echo "$arch" >> "$FAILED_ARCHES"
            continue
          fi

          # Include added files in the stash and in the regenerated patch.
          git add -A
          git stash push --include-untracked -m "patch-$arch"

          git checkout "${{ steps.get-commits.outputs.LATEST_COMMIT }}"
          if ! git stash apply stash^{/patch-$arch}; then
            echo "::error::Stash application failed for $arch on latest commit"
            git reset --hard
            git clean -fd
            git stash drop || true
            cd ..
            echo "$arch" >> "$FAILED_ARCHES"
            continue
          fi

          git add -A
          git diff --cached --binary --ignore-space-at-eol > "$PATCH_FILE"
          printf '# From upstream commit: %s\n' "${{ steps.get-commits.outputs.LATEST_COMMIT }}" >> "$PATCH_FILE"

          git reset --hard
          git clean -fd
          git stash drop || true
          cd ..

          echo "$arch" >> "$SUCCESSFUL_ARCHES"
        done

        # Set outputs for architecture results. The shared upstream marker only
        # advances after every patch is current or regenerated successfully.
        if [ -s "$SUCCESSFUL_ARCHES" ]; then
          echo "successful_arches=$(paste -sd, "$SUCCESSFUL_ARCHES")" >> "$GITHUB_OUTPUT"
        fi
        if [ -s "$FAILED_ARCHES" ]; then
          echo "failed_arches=$(paste -sd, "$FAILED_ARCHES")" >> "$GITHUB_OUTPUT"
        fi
        if [ "$(wc -l < "$SUCCESSFUL_ARCHES")" -eq 3 ] && [ ! -s "$FAILED_ARCHES" ]; then
          echo "all_arches_succeeded=true" >> "$GITHUB_OUTPUT"
        else
          echo "all_arches_succeeded=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Update commit reference
      if: steps.process-arches.outputs.all_arches_succeeded == 'true'
      run: |
        echo "${{ steps.get-commits.outputs.LATEST_COMMIT }}" > patches/last_processed_commit.txt

    - name: Prepare repo for PR
      if: steps.process-arches.outputs.all_arches_succeeded == 'true'
      run: |
        cd upstream-runner && git checkout ${{ steps.get-commits.outputs.LATEST_COMMIT_SHORT }} && cd ..
        cp -r upstream-runner/* .
        rm -rf upstream-runner

    - name: Import and configure the GPG key for Platform Engineering bot
      uses: crazy-max/ghaction-import-gpg@v6
      with:
        gpg_private_key: ${{ secrets.PE_BOT_GPG_PRIVATE_KEY }}
        passphrase: ${{ secrets.PE_BOT_GPG_PASSPHRASE }}
        git_config_global: true
        git_user_signingkey: true
        git_commit_gpgsign: true

    - name: Create pull request
      uses: peter-evans/create-pull-request@v8
      if: steps.process-arches.outputs.all_arches_succeeded == 'true'
      with:
        # 2025-08-22: Using GitHub's Personal Access Token is required to allow automated workflow
        # triggers (on: pull_request) from Pull Requests issued by this workflow.
        token: ${{ secrets.PE_BOT_PAT }}
        commit-message: "Update patches: ${{ steps.get-commits.outputs.PREVIOUS_COMMIT_SHORT }} → ${{ steps.get-commits.outputs.LATEST_COMMIT_SHORT }} [${{ steps.process-arches.outputs.successful_arches }}]"
        committer: Platform Engineering Bot <is-devops-team@canonical.com>
        author: Platform Engineering Bot <is-devops-team@canonical.com>
        branch: patch-sync/${{ steps.get-commits.outputs.LATEST_COMMIT_SHORT }}
        title: Sync main patch ${{ steps.get-commits.outputs.LATEST_COMMIT_SHORT }}
        body: Sync main branch patcdh for commit ${{ steps.get-commits.outputs.LATEST_COMMIT_SHORT }}

    - name: Fail if any architecture was not updated
      if: steps.process-arches.outputs.failed_arches != ''
      run: |
        echo "::error::Could not rebase patches onto ${{ steps.get-commits.outputs.LATEST_COMMIT_SHORT }} for: ${{ steps.process-arches.outputs.failed_arches }}. Rebase the patch manually."
        exit 1

    - uses: mattermost/action-mattermost-notify@master
      if: ${{ failure() }}
      with:
        MATTERMOST_WEBHOOK_URL: ${{ secrets.MM_WEBHOOK_URL }}
        TEXT: |
          ${{ github.repository }} build failed.
          [Pipeline](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) was failed :red_circle:
          ${{ secrets.MM_PING_USERS }}
        MATTERMOST_USERNAME: ${{ github.triggering_actor }}
        MATTERMOST_ICON_URL: https://cdn-icons-png.flaticon.com/512/25/25231.png
