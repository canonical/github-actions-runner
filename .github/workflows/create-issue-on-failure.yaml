name: Create Issue on Workflow Failure

on:
    workflow_run:
        # List the exact 'name:' values of the workflows you want to monitor.
        # Based on the repository, these are "Runner CI" and "Runner CD".
        workflows:
            - "Runner CI"
            - "Runner CD"
            - "patch_update_release" # Add any other critical workflows here
        types:
            - completed

# Permissions required to create an issue and read repository contents
permissions:
    issues: write
    contents: read

jobs:
    create-issue:
        # Only run this job if the triggered workflow concluded with a failure
        if: ${{ github.event.workflow_run.conclusion == 'failure' }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Create GitHub Issue on Failure
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
                  RUN_URL: ${{ github.event.workflow_run.html_url }}
                  REPOSITORY: ${{ github.repository }}
                  RUN_ID: ${{ github.event.workflow_run.id }}
              run: |
                  ISSUE_TITLE="CI/CD Pipeline Failed: ${WORKFLOW_NAME}"
                  ISSUE_BODY="The GitHub Actions workflow **${WORKFLOW_NAME}** has failed.\\n\\n **Run URL:** ${RUN_URL}\\n **Run ID:** ${RUN_ID}\\n\\nPlease investigate and resolve the issue."

                  # Check if an issue for this specific workflow run already exists to prevent duplicate spam on retries
                  EXISTING_ISSUE=$(gh issue list --repo "${REPOSITORY}" --state open --search "${RUN_ID}" --json number --jq '.[0].number')

                  if [ -n "$EXISTING_ISSUE" ]; then
                    echo "An issue for this workflow run already exists (#${EXISTING_ISSUE}). Skipping creation."
                  else
                    gh issue create \
                      --repo "${REPOSITORY}" \
                      --title "${ISSUE_TITLE}" \
                      --body "${ISSUE_BODY}" \
                      --label "bug", "ci-failure"
                  fi
