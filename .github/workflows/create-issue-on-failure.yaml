name: Create Issue on Workflow Failure

on:
    workflow_run:
        # List the exact 'name:' values of the workflows you want to monitor.
        workflows:
            - "Runner CI"
            - "Runner CD"
            - "Update Runner Patches (Commit-to-Commit)"
            - "Update Runner Patches (Release-to-Release)"
        types:
            - completed

# Permissions required to create an issue and read repository contents
permissions:
    issues: write
    contents: read

# Serialize shared issue writes without replacing pending failure reports.
concurrency:
    group: workflow-failure-reporting
    cancel-in-progress: false
    queue: max

jobs:
    create-issue:
        # Only run this job if the triggered workflow concluded with a failure
        if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Report workflow failure
              uses: actions/github-script@v8
              with:
                  script: |
                      const { reportWorkflowFailure } = require('./.github/scripts/report-workflow-failure.cjs');
                      await reportWorkflowFailure({ github, context });
